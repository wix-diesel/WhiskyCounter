<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Whisky Counter">
<link rel="manifest" href="manifest.webmanifest">
<title>Whisky Festival Counter</title>
<style>
:root{color-scheme:dark;--bg:#0b0b0d;--card:#17171b;--text:#f5f5f7;--muted:#a1a1aa;--line:#2b2b31;--accent:#d7a85b;--danger:#d95c5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#111114,#08080a);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:520px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}h1{font-size:25px;margin:4px 0 3px}.sub{color:var(--muted);font-size:13px;margin-bottom:18px}.card{background:rgba(23,23,27,.94);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px}.hero{text-align:center;padding:24px 18px 20px}.count{font-size:76px;line-height:1;font-weight:800;letter-spacing:-.06em;margin:4px 0 5px;font-variant-numeric:tabular-nums}.label{color:var(--muted);font-size:14px}.plus{width:100%;min-height:92px;border:0;border-radius:20px;background:var(--accent);color:#17120b;font-size:42px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.3);touch-action:manipulation}.plus:active{transform:scale(.985);filter:brightness(.92)}.minus{width:100%;margin-top:10px;min-height:48px;border:1px solid var(--line);border-radius:14px;background:#1d1d22;color:var(--text);font-size:16px;touch-action:manipulation}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#101014;border-radius:15px;padding:13px}.stat.wide{grid-column:1/-1}.stat .v{font-size:22px;font-weight:750;margin-top:4px;font-variant-numeric:tabular-nums}.stat .k{color:var(--muted);font-size:12px}.range{color:var(--accent)}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}input{width:100%;background:#101014;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:17px}.presets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.presets.abv{grid-template-columns:repeat(5,1fr)}.preset{border:1px solid var(--line);background:#101014;color:var(--text);border-radius:12px;padding:10px 4px;font-size:14px}.preset.active{border-color:var(--accent);color:var(--accent)}.danger{color:var(--danger);border-color:#593030;background:#241414}.footer{color:#71717a;font-size:11px;line-height:1.5;text-align:center;padding:4px 10px}button{font-family:inherit;cursor:pointer}.section-title{font-weight:700;margin-bottom:12px}
</style>
</head>
<body><main>
<h1>🥃 Whisky Festival Counter</h1><div class="sub">試飲をタップで記録。端末内に自動保存します。</div>
<section class="card hero"><div class="count" id="count">0</div><div class="label">試飲数</div><button class="plus" id="plus">＋ 試飲</button><button class="minus" id="minus">− 1杯戻す</button><div class="stats"><div class="stat"><div class="k">推定総量</div><div class="v" id="volume">0 ml</div></div><div class="stat"><div class="k">純アルコール</div><div class="v range" id="alcohol">0 g</div></div><div class="stat wide"><div class="k">日本酒換算（15%として計算）</div><div class="v range" id="sake">0合（0 ml）</div></div></div></section>
<section class="card"><div class="section-title">フェス設定</div><label for="ml">1杯あたりの量（ml）</label><input id="ml" type="number" min="1" max="100" step="1" inputmode="decimal" value="10"><div class="presets"><button class="preset" data-ml="5">5 ml</button><button class="preset active" data-ml="10">10 ml</button><button class="preset" data-ml="15">15 ml</button></div><div style="margin-top:14px"><label>度数（%）</label><div class="presets abv"><button class="preset abv active" data-abv="40">40</button><button class="preset abv" data-abv="45">45</button><button class="preset abv" data-abv="50">50</button><button class="preset abv" data-abv="55">55</button><button class="preset abv" data-abv="60">60</button></div></div></section>
<section class="card"><div class="section-title">記録</div><button class="minus danger" id="reset">今日のカウントをリセット</button></section>
<div class="footer">純アルコール量は「飲酒量 × 度数 × 0.8」で概算しています。<br>日本酒換算は、日本酒の度数を15%とみなして同じアルコール量になる量を計算したものです（1合＝180ml）。<br>実際の試飲量・度数が異なる場合、表示値も変わります。</div>
</main><script>
(()=>{const KEY="whisky-festival-counter-v1",ABV_OPTIONS=[40,45,50,55,60],$=id=>document.getElementById(id),state=JSON.parse(localStorage.getItem(KEY)||'{"count":0,"ml":10,"abv":40}');if(!ABV_OPTIONS.includes(state.abv))state.abv=40;if(!Array.isArray(state.drinks)){state.drinks=[];for(let i=0;i<Math.max(0,state.count||0);i++)state.drinks.push({ml:state.ml,abv:state.abv})}$("ml").value=state.ml;function save(){localStorage.setItem(KEY,JSON.stringify(state))}function num(id,f){const n=Number($(id).value);return Number.isFinite(n)?n:f}function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}function render(){const c=state.drinks.length;$("count").textContent=c;const totalMl=state.drinks.reduce((s,d)=>s+d.ml,0);$("volume").textContent=`${fmt(totalMl)} ml`;const alcoholG=state.drinks.reduce((s,d)=>s+d.ml*(d.abv/100)*.8,0);$("alcohol").textContent=`${fmt(alcoholG)} g`;const sakeMl=alcoholG/(0.15*0.8),sakeGo=sakeMl/180;$("sake").textContent=`${fmt(sakeGo)}合（${fmt(sakeMl)} ml）`;document.querySelectorAll(".preset[data-ml]").forEach(b=>b.classList.toggle("active",Number(b.dataset.ml)===Number(state.ml)));document.querySelectorAll(".preset[data-abv]").forEach(b=>b.classList.toggle("active",Number(b.dataset.abv)===Number(state.abv)));save()}$("plus").onclick=()=>{state.drinks.push({ml:Math.max(0,state.ml),abv:state.abv});render()};$("minus").onclick=()=>{state.drinks.pop();render()};$("reset").onclick=()=>{if(confirm("今日のカウントを0に戻しますか？")){state.drinks=[];render()}};$("ml").oninput=()=>{state.ml=Math.max(1,num("ml",10));render()};document.querySelectorAll(".preset[data-ml]").forEach(b=>b.onclick=()=>{state.ml=Number(b.dataset.ml);$("ml").value=state.ml;render()});document.querySelectorAll(".preset[data-abv]").forEach(b=>b.onclick=()=>{state.abv=Number(b.dataset.abv);render()});render()})()
</script></body></html>
